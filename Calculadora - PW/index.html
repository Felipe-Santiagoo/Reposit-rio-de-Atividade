<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora - CSS Grid</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <div class="calculadora">
        <div class="marca">CALCULADORA</div>
        
        <div class="display" id="display">
            0
        </div>

        <div class="botoes">
            <button class="cinza">C</button>
            <button class="cinza">+/-</button>
            <button class="cinza">%</button>
            <button class="laranja">÷</button>

            <button class="preto">7</button>
            <button class="preto">8</button>
            <button class="preto">9</button>
            <button class="laranja">×</button>

            <button class="preto">4</button>
            <button class="preto">5</button>
            <button class="preto">6</button>
            <button class="laranja">−</button>

            <button class="preto">1</button>
            <button class="preto">2</button>
            <button class="preto">3</button>
            <button class="laranja">+</button>

            <button class="preto zero">0</button>
            <button class="preto">.</button>
            <button class="verde igual">=</button>
        </div>
    </div>

</body>
</html>
